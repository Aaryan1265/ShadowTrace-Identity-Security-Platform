services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shadowtrace
      POSTGRES_USER: shadowtrace
      POSTGRES_PASSWORD: shadowtrace
    volumes:
      - shadowtrace-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shadowtrace -d shadowtrace"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://shadowtrace:shadowtrace@db:5432/shadowtrace
      APP_ENV: production
      SHADOWTRACE_API_KEY: change-me-in-production
    depends_on:
      db:
        condition: service_healthy

volumes:
  shadowtrace-postgres:
